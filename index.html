  </noscript>

  <!-- Apply saved theme before first paint to prevent flash -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('webstudio-theme') || localStorage.getItem('buildora-theme');
        if (t === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <!--gtm:body-->
  <div id="root"><!--seo:body:start--><!--seo:body:end--></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

<script type="text/javascript">
  (function () {
    function loadClarity() {
      (function (c, l, a, r, i, t, y) {
        c[a] = c[a] || function () { (c[a].q = c[a].q || []).push(arguments); };
        t = l.createElement(r); t.async = 1; t.src = "https://www.clarity.ms/tag/" + i;
        y = l.getElementsByTagName(r)[0]; y.parentNode.insertBefore(t, y);
      })(window, document, "clarity", "script", "z9bl5xe283");
    }
    if (document.readyState === "complete") {
      if ("requestIdleCallback" in window) requestIdleCallback(loadClarity);
      else setTimeout(loadClarity, 1500);
    } else {
      window.addEventListener("load", function () {
        if ("requestIdleCallback" in window) requestIdleCallback(loadClarity);
        else setTimeout(loadClarity, 1500);
      }, { once: true });
    }
  })();
</script>

</html>
