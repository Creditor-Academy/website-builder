server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # charset utf-8;
    # Send Content-Type: text/html; charset=utf-8 (and the same charset on
    # other text responses). Without it, some crawlers mis-read the en dash
    # in the home page title. Keep this directive on the public server.
    charset utf-8;
    charset_types text/html text/css text/plain text/xml application/javascript application/json application/xml image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    # Cache static assets. Unknown asset URLs stay a real 404 (no HTML body).
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|mp4|webm|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Builder, dashboard, and auth callbacks are a client-rendered app.
    # They must keep working for signed-in users. The shell is noindex.
    location ^~ /dashboard {
        try_files $uri $uri/ /app.html;
    }

    location ^~ /admin {
        try_files $uri $uri/ /app.html;
    }

    location ^~ /builder {
        try_files $uri $uri/ /app.html;
    }

    location ^~ /template-builder {
        try_files $uri $uri/ /app.html;
    }

    location ^~ /editor {
        try_files $uri $uri/ /app.html;
    }

    location ^~ /auth {
        try_files $uri $uri/ /app.html;
    }

    location = / {
        try_files /index.html =404;
    }

    # Marketing and account pages are prerendered as /route/index.html.
    # Anything else is an HTTP 404 with the noindex page, not the home page.
    location / {
        try_files $uri $uri/index.html =404;
        error_page 404 /404.html;
    }

    location = /404.html {
        internal;
    }

    location /api/ {
        proxy_pass http://<BACKEND_PRIVATE_IP>:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /sites/ {
        proxy_pass http://<BACKEND_PRIVATE_IP>:5000;
    }
}
